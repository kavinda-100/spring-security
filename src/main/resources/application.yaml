spring:
  application:
    name: spring-security

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spring_security}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    timeout: ${SESSION_TIMEOUT:30m}
    data:
      redis:
        repository-type: indexed
        namespace: spring:session:spring-security


  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: ${COOKIE_HTTP_ONLY:true}
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:Lax}
        path: /

app:
  security:
    super-admin-email: ${SUPER_ADMIN_EMAIL:kavinda@example.com}

logging:
  level:
    root: INFO
    com.kavinda: DEBUG
    org.springframework.web: INFO
    org.springframework.security.oauth2: DEBUG

  file:
    name: ${LOG_FILE:logs/spring-security.log}